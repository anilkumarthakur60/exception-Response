name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['11.*', '12.*', '13.*']
        dependency-version: [prefer-stable, prefer-lowest]
        include:
          - laravel: '11.*'
            testbench: '^9.5'
          - laravel: '12.*'
            testbench: '^10.0'
          - laravel: '13.*'
            testbench: '^11.0'
        exclude:
          - laravel: '13.*'
            php: '8.2'

    name: PHP ${{ matrix.php }} • Laravel ${{ matrix.laravel }} • ${{ matrix.dependency-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, json, sqlite, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ matrix.dependency-version }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ matrix.dependency-version }}-
            composer-${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-
            composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Pin Laravel & Testbench
        run: |
          composer require --dev --no-interaction --no-update \
            "orchestra/testbench:${{ matrix.testbench }}"
          composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction --no-progress

      - name: Lint PHP source
        run: find src tests -name "*.php" -print0 | xargs -0 -n1 -P4 php -l

      - name: Run tests
        run: vendor/bin/phpunit --colors=always
