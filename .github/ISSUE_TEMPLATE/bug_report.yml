name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A concise description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Steps to reproduce, or a link to a minimal repo. Include the exception thrown and the response received.
      render: shell
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: "2.0.0"
    validations:
      required: true
  - type: input
    id: laravel-version
    attributes:
      label: Laravel version
      placeholder: "12.x"
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "8.3"
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant config
      description: Contents of `config/exception-response.php` if customised.
      render: php
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and didn't find a duplicate.
          required: true
        - label: I'm using the slim Laravel application skeleton (no `app/Exceptions/Handler.php`).
          required: true
